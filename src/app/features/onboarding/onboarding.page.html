<ion-content [fullscreen]="true">

  <div class="onboarding">

    <div class="header">

      <p class="eyebrow">
        WEIGHT
      </p>

      <h1>
        Let's set your goal
      </h1>

      <p class="subtitle">
        Set your starting point and where
        you'd like to go.
      </p>

    </div>

    <app-goal-editor
      buttonLabel="GET STARTED"
      (saved)="saveGoal($event)"
    />

  </div>

</ion-content>
