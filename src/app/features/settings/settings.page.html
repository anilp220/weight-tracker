<ion-content [fullscreen]="true">

  <div class="settings-screen">

    <header class="screen-header">

      <h1>Settings</h1>

      <p>
        Manage your weight goal
      </p>

    </header>


    <section class="settings-section">

      <h2>Goal</h2>

      <div class="settings-card">

        <app-goal-editor
          [goal]="goal()"
          buttonLabel="SAVE GOAL"
          (saved)="saveGoal($event)"
        />

      </div>

    </section>

  </div>

</ion-content>
